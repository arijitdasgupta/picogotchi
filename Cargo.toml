[workspace]
members = ["firmware", "tama"]
# `cargo test` / `cargo build` at the workspace root operate on the portable
# core crate, which is host-testable. The firmware is built from `firmware/`,
# where the `.cargo/config.toml` selects the RP2350 target:
#     cd firmware && cargo run
default-members = ["tama"]
resolver = "2"

# Profiles are workspace-wide and must be defined at the root.
# They deliberately force codegen-units = 1, LTO and opt-level 3 even in dev,
# because size and speed matter on this MCU.

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
